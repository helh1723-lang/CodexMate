schema: codexmate.config/v1
repo:
  default_branch: main
members:
  - login: replace-owner
    role: owner
    paths: [src, docs]
  - login: replace-developer
    role: developer
    paths: [src, tests]
# Copy device IDs from each member's `codexmate doctor` output.
# Changing a device requires stopping the old Worker first.
workers:
  replace-owner: replace-device-id
  replace-developer: replace-device-id
